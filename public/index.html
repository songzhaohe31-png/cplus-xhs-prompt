<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPLUS 新媒体运营助手</title>
  <link rel="stylesheet" href="/css/style.v19.css">
  <link rel="stylesheet" href="/css/theme.v19.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand" onclick="go('home')">
        <img class="logo" src="/img/cplus-mark.v19.png" alt="CPLUS GROUP">
        <div class="brand-text">
          <strong>CPLUS</strong>
          <span>新媒体助手</span>
        </div>
      </div>
      <nav class="nav" id="steps">
        <p class="nav-label">开始</p>
        <button type="button" data-page="home" onclick="go('home')">工作台</button>
        <p class="nav-label">资料</p>
        <button type="button" data-page="facts" onclick="go('facts')">业务资料</button>
        <button type="button" data-page="samples" onclick="go('samples')">历史文案与海报</button>
        <p class="nav-label">AI分析</p>
        <button type="button" data-page="style" onclick="go('style')">账号风格分析</button>
        <button type="button" data-page="rules" onclick="go('rules')">已确认风格规则</button>
        <p class="nav-label">内容制作</p>
        <button type="button" data-page="topics" onclick="go('topics')">主题规划</button>
        <button type="button" data-page="produce" onclick="go('produce')">图文生成</button>
        <button type="button" data-page="schedule" onclick="go('schedule')">内容排期</button>
        <p class="nav-label">成果</p>
        <button type="button" data-page="reports" onclick="go('reports')">PDF报告</button>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" onclick="toggleSide()">菜单</button>
        <div class="brand mobile-brand" onclick="go('home')">
          <img class="logo" src="/img/cplus-mark.v19.png" alt="CPLUS">
          <strong>CPLUS</strong>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <main class="stage" id="stage"></main>
    </div>
  </div>

  <div class="savebar hidden" id="savebar">
    <span id="saveState"></span>
    <button type="button" class="btn hidden" onclick="saveRules(true)">保存</button>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="veil hidden" id="veil"><p id="veilText">处理中</p></div>
  <div class="sheet hidden" id="sheet"></div>
  <div id="pdfMount" class="pdf-mount" aria-hidden="true"></div>

  <script src="/js/app.v19.js"></script>
  <script src="/js/workbench.v19.js"></script>
  <script src="/js/flow.v19.js"></script>
  <script>boot();</script>
</body>
</html>
