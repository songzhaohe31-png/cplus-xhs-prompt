<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPLUS 新媒体运营工作台</title>
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="stylesheet" href="/css/style.css?v=15">
  <link rel="stylesheet" href="/css/theme.css?v=15">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand" onclick="go('chat')">
        <img class="logo" src="/img/cplus-mark.png" alt="CPLUS GROUP">
        <div class="brand-text">
          <strong>CPLUS</strong>
          <span>运营工作台</span>
        </div>
      </div>
      <nav class="nav" id="steps">
        <p class="nav-label">工作</p>
        <button type="button" data-page="chat" onclick="go('chat')">AI 助理</button>
        <button type="button" data-page="calendar" onclick="go('calendar')">内容日历</button>
        <button type="button" data-page="library" onclick="go('library')">内容库</button>
        <button type="button" data-page="review" onclick="go('review')">数据复盘</button>
        <p class="nav-label">资料</p>
        <button type="button" data-page="knowledge" onclick="go('knowledge')">企业知识库</button>
        <button type="button" data-page="history" onclick="go('history')">历史内容</button>
        <button type="button" data-page="agent" onclick="go('agent')">品牌及内容规则</button>
        <p class="nav-label">系统</p>
        <button type="button" data-page="users" onclick="go('users')" class="admin-only" style="display:none">用户与权限</button>
        <button type="button" data-page="aisettings" onclick="go('aisettings')">AI 设置</button>
        <button type="button" data-page="logs" onclick="go('logs')">系统日志</button>
        <p class="nav-label admin-only">高级</p>
        <button type="button" class="admin-only" data-page="generate" onclick="go('generate')">海报工作台</button>
        <button type="button" class="admin-only" data-page="prompt" onclick="go('prompt')">Prompt 模板</button>
        <button type="button" class="admin-only" data-page="produce" onclick="go('produce')">旧版出稿</button>
        <button type="button" class="admin-only" data-page="materials" onclick="go('materials')">素材</button>
        <button type="button" class="admin-only" data-page="rules" onclick="go('rules')">账号规则</button>
        <button type="button" class="admin-only" data-page="feed" onclick="go('feed')">喂帖</button>
        <button type="button" class="admin-only" data-page="style" onclick="go('style')">风格</button>
        <button type="button" class="admin-only" data-page="archive" onclick="go('archive')">存档</button>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" onclick="toggleSide()">菜单</button>
        <div class="brand mobile-brand" onclick="go('chat')">
          <img class="logo" src="/img/cplus-mark.png" alt="CPLUS">
          <strong>CPLUS</strong>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <main class="stage" id="stage"></main>
    </div>
  </div>

  <div class="savebar hidden" id="savebar">
    <span id="saveState">规则已保存</span>
    <button type="button" class="btn" onclick="saveRules(true)">保存规则</button>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="veil hidden" id="veil"><p id="veilText">处理中</p></div>
  <div class="sheet hidden" id="sheet"></div>
  <div id="pdfMount" class="pdf-mount" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/js/app.js?v=15"></script>
  <script src="/js/workbench.js?v=15"></script>
  <script>boot();</script>
</body>
</html>
