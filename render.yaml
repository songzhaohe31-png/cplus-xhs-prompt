services:
  - type: web
    name: cplus-xhs-prompt
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
