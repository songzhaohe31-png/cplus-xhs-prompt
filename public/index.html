<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPLUS 新媒体运营助手</title>
  <link rel="stylesheet" href="/css/style.v23.css">
  <link rel="stylesheet" href="/css/theme.v23.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand" onclick="go('learn')">
        <img class="logo" src="/img/cplus-mark.v23.png" alt="CPLUS GROUP">
        <div class="brand-text">
          <strong>CPLUS</strong>
          <span>新媒体助手</span>
        </div>
      </div>
      <nav class="nav" id="steps">
        <button type="button" data-page="learn" onclick="go('learn')">AI学习中心</button>
        <button type="button" data-page="studio" onclick="go('studio')">内容制作中心</button>
        <button type="button" data-page="results" onclick="go('results')">成果中心</button>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" onclick="toggleSide()">菜单</button>
        <div class="brand mobile-brand" onclick="go('learn')">
          <img class="logo" src="/img/cplus-mark.v23.png" alt="CPLUS">
          <strong>CPLUS</strong>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <main class="stage" id="stage"></main>
    </div>
  </div>

  <div class="savebar hidden" id="savebar">
    <span id="saveState"></span>
    <button type="button" class="btn hidden" onclick="saveRules(true)">保存</button>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="veil hidden" id="veil"><p id="veilText">处理中</p></div>
  <div class="sheet hidden" id="sheet"></div>
  <div id="pdfMount" class="pdf-mount" aria-hidden="true"></div>

  <script src="/js/app.v23.js"></script>
  <script src="/js/workbench.v23.js"></script>
  <script src="/js/flow.v23.js"></script>
  <script>boot();</script>
</body>
</html>
