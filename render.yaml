services:
  - type: web
    name: cplus-xhs-prompt
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: AI_PROVIDER
        value: xai
      - key: AI_API_BASE
        value: https://api.x.ai/v1
      - key: AI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: grok-4.6
      - key: IMAGE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
