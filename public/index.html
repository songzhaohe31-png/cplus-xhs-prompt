<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPLUS 新媒体运营助手</title>
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="stylesheet" href="/css/style.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand" onclick="go('chat')">
        <img class="logo" src="/img/cplus-mark.png" alt="CPLUS GROUP">
        <div class="brand-text">
          <strong>CPLUS</strong>
          <span>新媒体助手</span>
        </div>
      </div>
      <nav class="nav" id="steps">
        <p class="nav-label">工作</p>
        <button type="button" data-page="chat" onclick="go('chat')">AI 助理</button>
        <button type="button" data-page="calendar" onclick="go('calendar')">内容日历</button>
        <button type="button" data-page="library" onclick="go('library')">内容库</button>
        <button type="button" data-page="review" onclick="go('review')">数据复盘</button>
        <p class="nav-label">资料</p>
        <button type="button" data-page="knowledge" onclick="go('knowledge')">资料库</button>
        <button type="button" data-page="history" onclick="go('history')">历史内容</button>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button type="button" class="menu-btn" onclick="toggleSide()">菜单</button>
        <div class="brand mobile-brand" onclick="go('chat')">
          <img class="logo" src="/img/cplus-mark.png" alt="CPLUS">
          <strong>CPLUS</strong>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <main class="stage" id="stage"></main>
    </div>
  </div>

  <div class="savebar hidden" id="savebar">
    <span id="saveState"></span>
    <button type="button" class="btn hidden" onclick="saveRules(true)">保存</button>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="veil hidden" id="veil"><p id="veilText">处理中</p></div>
  <div class="sheet hidden" id="sheet"></div>
  <div id="pdfMount" class="pdf-mount" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/js/app.js?v=16"></script>
  <script src="/js/workbench.js?v=16"></script>
  <script>boot();</script>
</body>
</html>
